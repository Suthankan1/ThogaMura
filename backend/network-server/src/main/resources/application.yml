spring:
  application:
    name: thogamura-network-server
  main:
    web-application-type: none
  datasource:
    url: ${THOGAMURA_DB_URL:jdbc:postgresql://localhost:5432/thogamura}
    username: ${THOGAMURA_DB_USER:thogamura}
    password: ${THOGAMURA_DB_PASSWORD:}
  flyway:
    enabled: true

thogamura:
  followup:
    owners: ${THOGAMURA_FOLLOWUP_OWNERS:}
  access:
    enabled: ${THOGAMURA_ACCESS_ENABLED:false}
    signing-key: ${THOGAMURA_ACCESS_SIGNING_KEY:}
  command:
    server:
      # Disabled by default in tests; enable explicitly when starting warehouse server
      enabled: ${THOGAMURA_COMMAND_SERVER_ENABLED:false}
      host: ${THOGAMURA_COMMAND_SERVER_HOST:127.0.0.1}
      port: ${THOGAMURA_COMMAND_SERVER_PORT:7443}
      backlog: ${THOGAMURA_COMMAND_SERVER_BACKLOG:50}
      read-timeout-ms: ${THOGAMURA_COMMAND_SERVER_READ_TIMEOUT_MS:5000}
      max-clients: ${THOGAMURA_COMMAND_SERVER_MAX_CLIENTS:50}
      max-frame-bytes: ${THOGAMURA_COMMAND_SERVER_MAX_FRAME_BYTES:65536}
      # Security: Loopback only for plaintext development; non-loopback requires TLS
      allow-non-loopback-plaintext: ${THOGAMURA_COMMAND_ALLOW_NON_LOOPBACK_PLAINTEXT:false}
  tls:
    server:
      # Validated JSSE TLS encryption for central warehouse command listener (Member 5 - Issue #23)
      enabled: ${THOGAMURA_TLS_SERVER_ENABLED:${THOGAMURA_TLS_ENABLED:false}}
      keystore-path: ${THOGAMURA_TLS_KEYSTORE_PATH:.certs/server-keystore.p12}
      keystore-password: ${THOGAMURA_TLS_KEYSTORE_PASSWORD:}
      keystore-type: ${THOGAMURA_TLS_KEYSTORE_TYPE:PKCS12}
      protocols: ${THOGAMURA_TLS_PROTOCOLS:TLSv1.3,TLSv1.2}
  notifications:
    # Disabled by default; enable explicitly when running the network server
    enabled: ${THOGAMURA_NOTIFICATIONS_ENABLED:false}
    # Security: Restrict binding to loopback by default for local development safety (Issue #33)
    host: ${THOGAMURA_NOTIFICATIONS_HOST:127.0.0.1}
    port: ${THOGAMURA_NOTIFICATIONS_PORT:7444}
    max-clients: ${THOGAMURA_NOTIFICATIONS_MAX_CLIENTS:100}
    max-pending-messages: ${THOGAMURA_NOTIFICATIONS_MAX_PENDING:50}
    # Security: Explicit operator approval required before binding beyond loopback
    allow-non-loopback: ${THOGAMURA_NOTIFICATIONS_ALLOW_NON_LOOPBACK:false}
    # Security: Approved branch gateway IP addresses (comma-separated; defaults to loopback if empty)
    allowed-clients: ${THOGAMURA_NOTIFICATIONS_ALLOWED_CLIENTS:}
  supplier:
    # Outbound Java URL/HTTP mock supplier endpoint (Member 2 - Issue #31, #32)
    base-url: ${THOGAMURA_SUPPLIER_BASE_URL:http://127.0.0.1:8090}
    connect-timeout-ms: ${THOGAMURA_SUPPLIER_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${THOGAMURA_SUPPLIER_READ_TIMEOUT_MS:5000}
    max-response-bytes: ${THOGAMURA_SUPPLIER_MAX_RESPONSE_BYTES:16384}
    approved-origins: ${THOGAMURA_SUPPLIER_APPROVED_ORIGINS:}

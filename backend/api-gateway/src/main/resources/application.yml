spring:
  application:
    name: thogamura-api-gateway
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info

thogamura:
  command:
    client:
      host: ${THOGAMURA_WAREHOUSE_HOST:${THOGAMURA_COMMAND_HOST:127.0.0.1}}
      port: ${THOGAMURA_COMMAND_PORT:7443}
      connect-timeout-ms: ${THOGAMURA_COMMAND_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${THOGAMURA_COMMAND_READ_TIMEOUT_MS:5000}
      max-frame-bytes: ${THOGAMURA_COMMAND_MAX_FRAME_BYTES:65536}
  notifications:
    subscriber:
      # Disabled by default in starter/tests; enable when running gateway against network server
      enabled: ${THOGAMURA_NOTIFICATIONS_SUBSCRIBER_ENABLED:false}
      # Warehouse NIO notification host/port (loopback by default for private demo LAN)
      host: ${THOGAMURA_NOTIFICATIONS_HOST:127.0.0.1}
      port: ${THOGAMURA_NOTIFICATIONS_PORT:7444}
      max-frame-bytes: ${THOGAMURA_NOTIFICATIONS_MAX_FRAME_BYTES:65536}
      initial-backoff-ms: ${THOGAMURA_NOTIFICATIONS_INITIAL_BACKOFF_MS:500}
      max-backoff-ms: ${THOGAMURA_NOTIFICATIONS_MAX_BACKOFF_MS:10000}
      backoff-multiplier: ${THOGAMURA_NOTIFICATIONS_BACKOFF_MULTIPLIER:2.0}
    sse:
      # Max concurrent SSE clients allowed before rejecting new subscriptions
      max-emitters: ${THOGAMURA_SSE_MAX_EMITTERS:100}
      # Timeout for SSE connections in ms (0 = infinite / no timeout)
      emitter-timeout-ms: ${THOGAMURA_SSE_EMITTER_TIMEOUT_MS:0}
      # Queue capacity for asynchronous broadcast dispatch
      queue-capacity: ${THOGAMURA_SSE_QUEUE_CAPACITY:256}

# No PostgreSQL datasource here. Network-server is the sole DB owner.

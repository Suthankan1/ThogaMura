spring:
  application:
    name: thogamura-api-gateway
server:
  address: ${THOGAMURA_GATEWAY_BIND:127.0.0.1}
  port: ${THOGAMURA_GATEWAY_PORT:8080}
  servlet:
    session:
      tracking-modes: cookie
      cookie:
        name: THOGAMURA_SESSION
        http-only: true
        same-site: strict
        secure: ${THOGAMURA_ACCESS_SECURE_COOKIES:false}
management:
  endpoints:
    web:
      exposure:
        include: health,info

thogamura:
  access:
    enabled: ${THOGAMURA_ACCESS_ENABLED:false}
    signing-key: ${THOGAMURA_ACCESS_SIGNING_KEY:}
  cors:
    allowed-origins: ${THOGAMURA_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  command:
    client:
      host: ${THOGAMURA_WAREHOUSE_HOST:${THOGAMURA_COMMAND_HOST:127.0.0.1}}
      port: ${THOGAMURA_COMMAND_PORT:7443}
      connect-timeout-ms: ${THOGAMURA_COMMAND_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${THOGAMURA_COMMAND_READ_TIMEOUT_MS:5000}
      max-frame-bytes: ${THOGAMURA_COMMAND_MAX_FRAME_BYTES:65536}
      # Member 1 - Safe bounded retries with finite backoff (Issue #11)
      max-retries: ${THOGAMURA_COMMAND_MAX_RETRIES:2}
      retry-backoff-ms: ${THOGAMURA_COMMAND_RETRY_BACKOFF_MS:100}
      retry-backoff-multiplier: ${THOGAMURA_COMMAND_RETRY_BACKOFF_MULTIPLIER:2.0}
      max-retry-backoff-ms: ${THOGAMURA_COMMAND_MAX_RETRY_BACKOFF_MS:1000}
      max-pooled-connections: ${THOGAMURA_COMMAND_MAX_POOLED_CONNECTIONS:8}
  tls:
    client:
      # Validated JSSE TLS encryption for central warehouse command client (Member 5 - Issue #23)
      enabled: ${THOGAMURA_TLS_CLIENT_ENABLED:${THOGAMURA_TLS_ENABLED:false}}
      truststore-path: ${THOGAMURA_TLS_TRUSTSTORE_PATH:.certs/gateway-truststore.p12}
      truststore-password: ${THOGAMURA_TLS_TRUSTSTORE_PASSWORD:}
      truststore-type: ${THOGAMURA_TLS_TRUSTSTORE_TYPE:PKCS12}
      hostname-verification: ${THOGAMURA_TLS_HOSTNAME_VERIFICATION:true}
      protocols: ${THOGAMURA_TLS_PROTOCOLS:TLSv1.3,TLSv1.2}
  notifications:
    subscriber:
      # Disabled by default in starter/tests; enable when running gateway against network server
      enabled: ${THOGAMURA_NOTIFICATIONS_SUBSCRIBER_ENABLED:false}
      # Warehouse NIO notification host/port (loopback by default for private demo LAN)
      host: ${THOGAMURA_NOTIFICATIONS_HOST:127.0.0.1}
      port: ${THOGAMURA_NOTIFICATIONS_PORT:7444}
      max-frame-bytes: ${THOGAMURA_NOTIFICATIONS_MAX_FRAME_BYTES:65536}
      initial-backoff-ms: ${THOGAMURA_NOTIFICATIONS_INITIAL_BACKOFF_MS:500}
      max-backoff-ms: ${THOGAMURA_NOTIFICATIONS_MAX_BACKOFF_MS:10000}
      backoff-multiplier: ${THOGAMURA_NOTIFICATIONS_BACKOFF_MULTIPLIER:2.0}
    sse:
      # Max concurrent SSE clients allowed before rejecting new subscriptions
      max-emitters: ${THOGAMURA_SSE_MAX_EMITTERS:100}
      # Timeout for SSE connections in ms (0 = infinite / no timeout)
      emitter-timeout-ms: ${THOGAMURA_SSE_EMITTER_TIMEOUT_MS:0}
      # Queue capacity for asynchronous broadcast dispatch
      queue-capacity: ${THOGAMURA_SSE_QUEUE_CAPACITY:256}

# No PostgreSQL datasource here. Network-server is the sole DB owner.

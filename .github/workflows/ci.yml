name: verify
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Maven verify
        run: mvn -B -ntp -f backend/pom.xml clean verify
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Test
        run: npm test
        working-directory: frontend
      - name: Typecheck
        run: npm run typecheck
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser dependencies
        run: |
          npm --prefix frontend ci
          npm --prefix frontend exec -- playwright install --with-deps chromium
      - name: Build operator UI
        run: npm --prefix frontend run build
      - name: Configure disposable TLS stack
        run: |
          cp .env.example .env
          cat >> .env <<'ENV'
          THOGAMURA_TLS_ENABLED=true
          THOGAMURA_FRONTEND_MODE=start
          ENV
          ./scripts/generate-dev-certs.sh
        env:
          THOGAMURA_TLS_KEYSTORE_PASSWORD: change-this-keystore-password
          THOGAMURA_TLS_TRUSTSTORE_PASSWORD: change-this-truststore-password
      - name: Verify browser and Java workflow
        run: |
          ./start.sh
          ./start.sh seed
          npm --prefix frontend run test:browser
          ./scripts/verify-full-stock-workflow.sh
        env:
          THOGAMURA_VERIFY_DISPOSABLE: '1'
      - name: Stop disposable services
        if: always()
        run: ./stop.sh
